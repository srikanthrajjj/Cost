name: Build and Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file with secrets
        run: |
          echo "VITE_SK_API_KEY=${{ secrets.VITE_SK_API_KEY }}" > .env

      - name: Build
        run: npm run build

      - name: Verify API key is injected
        run: |
          if grep -r "sk-or-v1" dist/ > /dev/null 2>&1; then
            echo "✅ API key successfully injected into build"
          else
            echo "⚠️ Warning: API key may not be in build (check if it's needed at runtime)"
          fi

name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file with secrets
        run: |
          echo "VITE_SK_API_KEY=${{ secrets.VITE_SK_API_KEY }}" > .env

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (or your host)
        run: npm run deploy
        env:
          VITE_SK_API_KEY: ${{ secrets.VITE_SK_API_KEY }}

name: Build and Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Server chat/quote AI uses OPENROUTER_API_KEY first (see src/lib/ai-config.ts).
          # Set OPENROUTER_API_KEY in GitHub Secrets and Vercel env vars (Production + Preview).
          # VITE_SK_API_KEY remains as a legacy fallback during migration.
          build-env: |
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || secrets.VITE_SK_API_KEY }}
            VITE_SK_API_KEY=${{ secrets.VITE_SK_API_KEY || secrets.OPENROUTER_API_KEY }}
          env: |
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || secrets.VITE_SK_API_KEY }}
            VITE_SK_API_KEY=${{ secrets.VITE_SK_API_KEY || secrets.OPENROUTER_API_KEY }}
          production: true
          vercel-args: --force
